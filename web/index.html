<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCP Project Manager</title>
<link rel="stylesheet" href="/static/styles.css"/>
</head>

<body>
<div class="container">

  <h1>🧠 MCP Project Manager</h1>

  <div class="card">
    <h2>Add Project</h2>
    <input id="name" placeholder="Project Name" />
    <input id="path" placeholder="Project Path (/Users/...)" />
    <button class="primary" onclick="addProject()">Add Project</button>
  </div>

  <div class="card">
    <h2>Registered Projects</h2>
    <div id="projects" class="projects-list"></div>
  </div>

</div>
<script>

async function fetchState() {
  const res = await fetch("/projects/all");
  const data = await res.json();
  console.log(data)
  await renderProjects(data);
}

async function renderProjects(data) {
  const container = document.getElementById("projects");
  container.innerHTML = "";

  const activeRes = await fetch("/projects/active");
  const activeData = await activeRes.json();
  console.log(activeData)
  const active = activeData.name ?? null;

  for (const project of data.projects) {
    const name = project.name;
    const path = project.path;

    const item = document.createElement("div");
    item.className = "project-item";

    const info = document.createElement("div");
    info.className = "project-info";

    const nameRow = document.createElement("div");
    nameRow.className = "project-name";
    nameRow.innerText = name;

    if (name === active) {
      const badge = document.createElement("span");
      badge.className = "active-badge";
      badge.innerText = "ACTIVE";
      nameRow.appendChild(badge);
    }

    const pathEl = document.createElement("div");
    pathEl.className = "project-path";
    pathEl.innerText = path;

    info.appendChild(nameRow);
    info.appendChild(pathEl);

    const actions = document.createElement("div");
    actions.className = "actions";

    const activateBtn = document.createElement("button");
    activateBtn.className = "primary";
    activateBtn.innerText = "Activate";
    activateBtn.onclick = () => activateProject(name);

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "danger";
    deleteBtn.innerText = "Delete";
    deleteBtn.onclick = () => deleteProject(name);

    actions.appendChild(activateBtn);
    actions.appendChild(deleteBtn);
    item.appendChild(info);
    item.appendChild(actions);
    container.appendChild(item);
  }
}

async function addProject() {
  const response = await fetch("/projects/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: document.getElementById("name").value,
      path: document.getElementById("path").value
    })
  });

  if (!response.ok) {
    alert("One of the fields is missing, please check your input");
    return;
  }

  await fetchState();
}

async function activateProject(name) {
  const response = await fetch("/projects/set", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name })
  });

  if (response.ok) {
    alert("Activated " + name + " successfully");
  }

  await fetchState();
}

async function deleteProject(name) {
  const response = await fetch(`/projects/${name}`, {
    method: "DELETE"
  });

  if (!response.ok) {
    alert("Invalid request");
  }

  await fetchState();
}

fetchState();
</script>

</body>
</html>
